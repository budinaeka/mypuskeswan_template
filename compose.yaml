name: mypuskeswan

# MyPuskeswan — stack container (app PHP + MySQL 8).
# Cara pakai:
#   cp .env.example .env   # lalu isi password
#   docker compose up -d --build
#   docker compose logs -f app   # tunggu "[init-db] selesai"
#   buka http://localhost:8080 (atau sesuai APP_PORT)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mypuskeswan-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      TZ: ${TZ:-Asia/Jakarta}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mypuskeswan_db}
      DB_USER: ${DB_USER:-mypuskeswan}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
    volumes:
      # Upload user harus persisten di luar image
      - uploads:/var/www/html/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: mysql:8.0
    container_name: mypuskeswan-db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mypuskeswan_db}
      MYSQL_USER: ${DB_USER:-mypuskeswan}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di file .env}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
    name: mypuskeswan_mysql_data
  uploads:
    name: mypuskeswan_uploads
