# ---------------------------------------------------------------
# myPuskeswan — Apache hardening & rewrite rules
# Diaktifkan via `a2enconf mypuskeswan`
# ---------------------------------------------------------------

ServerSignature Off
ServerTokens Prod
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # File sensitif tidak boleh diakses langsung
    <FilesMatch "^(\.env|\.env\..*|compose\.ya?ml|Dockerfile|.*\.sql|.*\.md|.*\.sh|.*\.ini|.*\.log)$">
        Require all denied
    </FilesMatch>
</Directory>

# Folder upload: hanya file statis, tidak boleh eksekusi PHP/CGI
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    php_flag engine off
    <FilesMatch "\.(php|phtml|phar|php[0-9]|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>

# Sembunyikan dotfile & direktori VCS
<DirectoryMatch "/\.(git|svn|hg|idea|vscode)">
    Require all denied
</DirectoryMatch>

<LocationMatch "(?i)/(\.git|\.svn|\.env|node_modules|vendor)/">
    Require all denied
</LocationMatch>

# Header keamanan dasar
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # HSTS hanya relevan kalau container diletakkan di belakang TLS proxy
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header unset X-Powered-By
</IfModule>

# Cache aset statis (index.html sengaja no-cache agar update JS langsung terpakai)
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpeg "access plus 7 days"
    ExpiresByType image/png  "access plus 7 days"
    ExpiresByType image/webp "access plus 7 days"
    ExpiresByType text/css   "access plus 30 days"
    ExpiresByType application/javascript "access plus 30 days"
</IfModule>

<FilesMatch "^index\.html$">
    <IfModule mod_headers.c>
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </IfModule>
</FilesMatch>
